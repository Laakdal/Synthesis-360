[workspace]
resolver = "3"
members = ["crates/cad-core", "crates/cad-sketch", "crates/cad-kernel", "crates/cad-app", "spikes/occt-spike"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "LGPL-2.1-only"

[profile.dev.package."*"]
opt-level = 2

# Vendored Open CASCADE bindings (LGPL-2.1, from crates.io 0.3.0), patched for MSVC
# (OCCT defines Handle_X as a subclass under Visual C++) and extended for CAD360's kernel needs.
[patch.crates-io]
opencascade-sys = { path = "crates/vendor/opencascade-sys" }
opencascade = { path = "crates/vendor/opencascade" }
