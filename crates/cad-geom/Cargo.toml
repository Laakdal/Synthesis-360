[package]
name = "cad-geom"
description = "Independently implemented pure-Rust B-rep geometry kernel (curves, surfaces, NURBS, topology, primitives, mass properties, validation). No OCCT dependency."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
nalgebra = { version = "0.35", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
