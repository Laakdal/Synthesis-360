[package]
name = "cad-diff"
description = "Differential testing harness: runs the shared case catalogue (research/cases.json) through cad-geom (pure Rust), OCCT (cad-kernel / vendored opencascade) and recorded ASM reference data, and compares the results with explicit tolerances."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
cad-geom = { path = "../cad-geom" }
cad-kernel = { path = "../cad-kernel" }
# The vendored high-level OCCT wrapper (patched in the root Cargo.toml); used only for its
# BRepPrimAPI primitive builders (box, cylinder, cone, sphere, torus), which cad-kernel does not expose.
opencascade = "0.3"
glam = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
